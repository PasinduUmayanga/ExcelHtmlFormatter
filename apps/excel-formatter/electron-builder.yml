# Packaging for Windows and macOS. From the repo root: pnpm dist:excel (on Windows -> .exe, on a Mac -> .dmg)
# appId stays as it was before the FormaFlow rename, so new versions upgrade the installed app (ADR 0012).
appId: com.pasindu.excelhtmlformatter
productName: FormaFlow
copyright: Copyright © 2026 Pasindu

directories:
  output: dist
  buildResources: build

# Only the built app goes in the package (plus ExcelJS from node_modules, added automatically).
files:
  - out/**
  - package.json
  - '!**/*.map'
asar: true
# The workbook behind "Load sample" on the Upload screen (ADR 0017), outside the asar so it can be read as a file.
extraResources:
  - from: ../../packages/adapter-excel/samples/product_catalog.xlsx
    to: samples/product_catalog.xlsx
# No native modules, so nothing needs rebuilding for Electron.
npmRebuild: false

# ---------- Windows ----------
win:
  icon: build/icon.png
  target:
    - target: nsis # normal installer with Start-menu and desktop shortcuts
      arch: [x64]
    - target: portable # single .exe, no install needed
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false # installs for the current user: no admin rights needed
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FormaFlow
  artifactName: FormaFlow-Setup-${version}.${ext}
portable:
  artifactName: FormaFlow-${version}-portable.${ext}

# ---------- macOS ----------
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [universal] # one app for Intel and Apple Silicon Macs
  # No Apple Developer certificate yet: ad-hoc sign, so Apple Silicon Macs can run it
  # (users confirm once in System Settings > Privacy & Security > Open Anyway).
  # With a certificate: remove these two lines and set CSC_LINK / CSC_KEY_PASSWORD, plus notarization.
  identity: '-'
  hardenedRuntime: false
dmg:
  artifactName: FormaFlow-${version}-mac-universal.${ext}
