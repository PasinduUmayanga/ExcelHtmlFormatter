<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>FormaFlow</title>
    <!-- The FormaFlow mark (build/icon.svg), inline: the window's policy allows data: images only. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024'%3E %3Cg transform='scale%2816%29'%3E %3Crect width='64' height='64' rx='15' fill='%231F6FEB'/%3E %3Cpath d='M17.5 11H36l11 11v28.5a3.5 3.5 0 0 1-3.5 3.5h-26a3.5 3.5 0 0 1-3.5-3.5v-36a3.5 3.5 0 0 1 3.5-3.5z' fill='%23FFFFFF'/%3E %3Cpath d='M36 11v8.5a2.5 2.5 0 0 0 2.5 2.5H47z' fill='%23BFD4FB'/%3E %3Crect x='20' y='27' width='13' height='4.5' rx='2.25' fill='%230B2E6B'/%3E %3Crect x='20' y='35' width='20' height='3' rx='1.5' fill='%239FB9E6'/%3E %3Cpath d='M20 46h6.5c4.5 0 6-5 10.5-5h4.5' fill='none' stroke='%230B8277' stroke-width='3.6' stroke-linecap='round'/%3E %3Cpath d='M39 37.2l4 3.8-4 3.8' fill='none' stroke='%230B8277' stroke-width='3.6' stroke-linecap='round' stroke-linejoin='round'/%3E %3C/g%3E %3C/svg%3E"
    />
    <style>
      /*
       * The startup screen before the app's code runs (FormaFlow phase 7). React replaces #root's content when it
       * starts, with the same look (StartupScreen in @hf/ui). Colours follow the theme the main process set before
       * the window opened; keep them in line with @hf/ui's tokens.
       */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      .boot {
        --bg: #f6f7f9;
        --text: #1c2128;
        --muted: #5d6672;
        --track: #e2e5ea;
        --fill: #1f6feb;
        display: grid;
        place-items: center;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        .boot {
          --bg: #11161d;
          --text: #e6edf3;
          --muted: #9aa5b1;
          --track: #2a313b;
          --fill: #4c8dff;
        }
      }
      .boot-card {
        display: grid;
        justify-items: center;
        gap: 12px;
      }
      .boot-name {
        font-size: 22px;
        font-weight: 600;
      }
      .boot p {
        margin: 0;
        color: var(--muted);
      }
      .boot-bar {
        position: relative;
        width: 200px;
        height: 6px;
        border-radius: 3px;
        background: var(--track);
        overflow: hidden;
      }
      .boot-bar span {
        position: absolute;
        width: 30%;
        height: 100%;
        border-radius: 3px;
        background: var(--fill);
        animation: boot-slide 1.2s ease-in-out infinite;
      }
      @keyframes boot-slide {
        from {
          left: -30%;
        }
        to {
          left: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar span {
          animation-duration: 4s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot-card" role="status">
          <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
            <rect width="64" height="64" rx="15" fill="#1F6FEB" />
            <path
              d="M17.5 11H36l11 11v28.5a3.5 3.5 0 0 1-3.5 3.5h-26a3.5 3.5 0 0 1-3.5-3.5v-36a3.5 3.5 0 0 1 3.5-3.5z"
              fill="#FFFFFF"
            />
            <path d="M36 11v8.5a2.5 2.5 0 0 0 2.5 2.5H47z" fill="#BFD4FB" />
            <rect x="20" y="27" width="13" height="4.5" rx="2.25" fill="#0B2E6B" />
            <rect x="20" y="35" width="20" height="3" rx="1.5" fill="#9FB9E6" />
            <path
              d="M20 46h6.5c4.5 0 6-5 10.5-5h4.5"
              fill="none"
              stroke="#0B8277"
              stroke-width="3.6"
              stroke-linecap="round"
            />
            <path
              d="M39 37.2l4 3.8-4 3.8"
              fill="none"
              stroke="#0B8277"
              stroke-width="3.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <div class="boot-name">FormaFlow</div>
          <p>Starting…</p>
          <div class="boot-bar"><span></span></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
